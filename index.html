function loop(now){let dt=Math.min((now-last)/1000,.035);last=now;if(state==='play')tick(dt);draw();requestAnimationFrame(loop)}function start(){$('#home').classList.add('hide');$('#missionHUD').classList.remove('hide');$('#gameFrame').classList.remove('hide');$('#gameFooter').classList.remove('hide');$('#returnHome').classList.add('hide');$('#pauseOverlay').classList.add('hide');$('#pauseBtn').textContent='PAUSE';$('#overlay').classList.add('hide');seedWorld();playSound('power')}function togglePause(){if(state==='play'){state='paused';$('#pauseOverlay').classList.remove('hide');$('#pauseBtn').textContent='RESUME'}else if(state==='paused'){state='play';$('#pauseOverlay').classList.add('hide');$('#pauseBtn').textContent='PAUSE'}}function returnHome(){if(state==='play'||state==='paused')finishRunProgress();state='menu';keys.left=keys.right=false;$('#overlay').classList.add('hide');$('#gameFrame').classList.add('hide');$('#gameFooter').classList.add('hide');$('#missionHUD').classList.add('hide');$('#pauseOverlay').classList.add('hide');$('#home').classList.remove('hide')}
